# TrueNAS SCALE 24.10+ Custom App template.
# Replace every CHANGE_ME value and the POOL path before installing.
services:
  dashboard:
    image: ghcr.io/askingrouge/home-lab-dashboard:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "18000:8000"
    environment:
      FLASK_ENV: production
      FLASK_SECRET_KEY: "CHANGE_ME_FLASK_SECRET"
      DATABASE_URL: "postgresql+psycopg://homelab:CHANGE_ME_DATABASE_PASSWORD@database:5432/homelab_dashboard"
      GOOGLE_OAUTH_CLIENT_ID: "CHANGE_ME_GOOGLE_CLIENT_ID"
      GOOGLE_OAUTH_CLIENT_SECRET: "CHANGE_ME_GOOGLE_CLIENT_SECRET"
      GOOGLE_OAUTH_REDIRECT_URI: "https://CHANGE_ME_HOSTNAME/auth/callback"
      ALLOWED_GOOGLE_EMAILS: "CHANGE_ME_ADMIN_EMAIL"
      ALLOW_INSECURE_DEV_AUTH: "false"
      SCHEDULER_ENABLED: "true"
      CHECK_TIMEOUT_SECONDS: "10"
      SESSION_COOKIE_SECURE: "true"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homelab_dashboard
      POSTGRES_USER: homelab
      POSTGRES_PASSWORD: "CHANGE_ME_DATABASE_PASSWORD"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /mnt/POOL/apps/home-lab-dashboard/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelab -d homelab_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
